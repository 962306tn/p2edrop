<style>
:root{
  --max:1240px; --content:860px; --gutter:16px;
  --navy:#17243A; --blue:#7EA7B2; --cloud:#F3F1ED;
  --soft:#EAF2F4; --badge:#DDEAEE;
  --text:#17243A; --soft-text:#374151; --muted:#6B7280; --border:#E5E7EB;
  --cta:#17243A; --cta-hover:#0C0D0F;
}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--text);
  font-family:"Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  font-size:17px;line-height:1.65;-webkit-font-smoothing:antialiased}
.wrap{max-width:var(--max);margin:0 auto;padding:0 var(--gutter)}
h1,h2,h3{font-family:"Outfit",Georgia,serif;font-weight:600;letter-spacing:-.01em;line-height:1.2;margin:0}
p{margin:0 0 1em}
@media(max-width:1439px){:root{--gutter:60px}}
@media(max-width:1024px){:root{--gutter:40px}}
@media(max-width:768px){:root{--gutter:24px}body{font-size:16px}}
@media(max-width:480px){:root{--gutter:16px}}
.li__body{color:var(--soft-text)}
/* ---- stock notice ---- */
.stock{max-width:var(--content);margin:36px auto;padding:20px 22px;border:1px solid #E3C4C4;
  background:#FCF1F1;border-radius:12px;color:#7A2E2E;font-size:15px}
.stock h3{font-size:17px;margin-bottom:8px;color:#7A2E2E}
</style>

<!-- ========== 6. STOCK NOTICE ========== -->
<div class="wrap">
  <div class="stock">
    <h3>One thing worth knowing</h3>
    <p style="margin:0">VelaHush is sold here and nowhere else. If you see it on a marketplace listing, it did not come from us and we cannot honour the return window on it.</p>
    <!-- The source page pairs this with a fabricated "Only 43 left" counter.
         Do not add a stock number unless it is read from real inventory. -->
  </div>
</div>
